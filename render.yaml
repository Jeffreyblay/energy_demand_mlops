services:
  - type: web
    name: gridvision-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POSTGRES_DSN
        sync: false   # set manually in the Render dashboard (Neon connection string)
      - key: DASHBOARD_ORIGIN
        sync: false   # e.g. https://<username>.github.io
